# 협업자에게 할 일이 생기면 텔레그램으로 알린다. 코드는 언제나 기본 브랜치의 것을 쓰고
# PR의 코드는 실행하지 않는다. 받는 사람의 값은 저장소 Secrets와 Variables에 있다.
name: Telegram alerts

on:
  issues:
    types: [assigned]
  pull_request_target:
    types: [review_requested]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/알림 ') || contains(github.event.issue.labels.*.name, '협업')) &&
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node .github/scripts/telegram-alert.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PRINCESS_TELEGRAM_CHAT_ID: ${{ secrets.PRINCESS_TELEGRAM_CHAT_ID }}
          PRINCE_TELEGRAM_CHAT_ID: ${{ secrets.PRINCE_TELEGRAM_CHAT_ID }}
          PRINCESS_GITHUB_LOGIN: ${{ vars.PRINCESS_GITHUB_LOGIN }}
          PRINCE_GITHUB_LOGIN: ${{ vars.PRINCE_GITHUB_LOGIN }}
