# Checks every push to main and every pull request the same way as on a
# laptop: install from the lockfile, typecheck, run the API and unit tests,
# build both packages, then click through the built app in Chrome.
# pnpm's version comes from packageManager in package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The browser tests alone take about 10 minutes on GitHub's runners
    # (3 on a laptop) and grow with each feature, so the job has room past them.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      - run: node --test .github/scripts/telegram-alert.test.mjs
      - run: npm run build
      # Browser flows and accessibility checks on the built app, in the
      # runner's installed Chrome.
      - run: npm run e2e
