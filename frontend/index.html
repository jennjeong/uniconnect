<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Share previews: title and description come from .figma/make/site.json
         and follow each screen (src/lib/pageMeta.ts); the 1200×630 image,
         public/og-image.png, needs the site's absolute URL there. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="uniconnect" />
    <meta property="og:locale" content="ko_KR" />
    <!-- Installing it as an app: public/manifest.webmanifest, its icons in
         public/icons/ and the service worker public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1b3f8f" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
